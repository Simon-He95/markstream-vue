name: Release (Stable)

on:
  push:
    tags:
      # Stable package tags: <pkg>@<semver>
      # e.g. markstream-vue@0.0.4, markstream-react@0.0.3-beta.2
      - '*@[0-9]*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-stable
  queue: max
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Parse tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          PKG="${TAG%@*}"
          VERSION="${TAG##*@}"

          if [[ -z "${PKG}" || -z "${VERSION}" ]]; then
            echo "Invalid tag: ${TAG}"
            exit 1
          fi

          PRERELEASE=false
          if [[ "${VERSION}" == *-* ]]; then
            PRERELEASE=true
          fi

          FAMILY_BREAKING=false
          case "${PKG}" in
            markstream-react|markstream-octane|markstream-svelte|markstream-angular|markstream-vue2)
              case "${VERSION}" in
                0.1.0|0.1.0-*) FAMILY_BREAKING=true ;;
              esac
              ;;
          esac

          echo "pkg=${PKG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${PRERELEASE}" >> "${GITHUB_OUTPUT}"
          echo "family_breaking=${FAMILY_BREAKING}" >> "${GITHUB_OUTPUT}"
          echo "name=[${PKG}] ${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Checkout (for changelog body)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          registry-url: https://registry.npmjs.org
        # npm authentication: setup-node writes the registry auth token to
        # ~/.npmrc only when NODE_AUTH_TOKEN is visible. Keep this env here —
        # without it every first-time publish fails with a 404 from the
        # registry (npm's unauthenticated PUT response).
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Resolve and validate package manifest
        id: package
        env:
          PACKAGE_NAME: ${{ steps.meta.outputs.pkg }}
          PACKAGE_VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          case "${PACKAGE_NAME}" in
            markstream-vue) PACKAGE_DIR="."; PACKAGE_JSON="package.json" ;;
            stream-markdown-parser) PACKAGE_DIR="packages/markdown-parser"; PACKAGE_JSON="packages/markdown-parser/package.json" ;;
            markstream-core) PACKAGE_DIR="packages/markstream-core"; PACKAGE_JSON="packages/markstream-core/package.json" ;;
            markstream-angular) PACKAGE_DIR="packages/markstream-angular"; PACKAGE_JSON="packages/markstream-angular/package.json" ;;
            markstream-octane) PACKAGE_DIR="packages/markstream-octane"; PACKAGE_JSON="packages/markstream-octane/package.json" ;;
            markstream-react) PACKAGE_DIR="packages/markstream-react"; PACKAGE_JSON="packages/markstream-react/package.json" ;;
            markstream-svelte) PACKAGE_DIR="packages/markstream-svelte"; PACKAGE_JSON="packages/markstream-svelte/package.json" ;;
            markstream-vue2) PACKAGE_DIR="packages/markstream-vue2"; PACKAGE_JSON="packages/markstream-vue2/package.json" ;;
            markstream-solid) PACKAGE_DIR="packages/markstream-solid"; PACKAGE_JSON="packages/markstream-solid/package.json" ;;
            *) echo "Unknown package: ${PACKAGE_NAME}" >&2; exit 1 ;;
          esac

          MANIFEST_NAME="$(node --input-type=module -e 'import { readFileSync } from "node:fs"; const manifest = JSON.parse(readFileSync(process.argv[1], "utf8")); process.stdout.write(String(manifest.name ?? ""))' "${PACKAGE_JSON}")"
          MANIFEST_VERSION="$(node --input-type=module -e 'import { readFileSync } from "node:fs"; const manifest = JSON.parse(readFileSync(process.argv[1], "utf8")); process.stdout.write(String(manifest.version ?? ""))' "${PACKAGE_JSON}")"

          if [[ "${MANIFEST_NAME}" != "${PACKAGE_NAME}" ]]; then
            echo "Tag package ${PACKAGE_NAME} maps to ${PACKAGE_JSON}, but the manifest name is ${MANIFEST_NAME}." >&2
            exit 1
          fi
          if [[ "${MANIFEST_VERSION}" != "${PACKAGE_VERSION}" ]]; then
            echo "Tag version ${PACKAGE_VERSION} does not match ${PACKAGE_JSON} version ${MANIFEST_VERSION}." >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME}" != "${MANIFEST_NAME}@${MANIFEST_VERSION}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} is not the canonical manifest tag ${MANIFEST_NAME}@${MANIFEST_VERSION}." >&2
            exit 1
          fi

          echo "package_dir=${PACKAGE_DIR}" >> "${GITHUB_OUTPUT}"
          echo "package_json=${PACKAGE_JSON}" >> "${GITHUB_OUTPUT}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release verification
        if: ${{ steps.meta.outputs.pkg == 'markstream-vue' }}
        run: pnpm release:verify

      - name: Run parser release verification
        if: ${{ steps.meta.outputs.pkg == 'stream-markdown-parser' }}
        run: pnpm verify:parser-release

      - name: Build package for npm
        if: ${{ steps.meta.outputs.pkg != 'markstream-vue' }}
        env:
          PACKAGE_DIR: ${{ steps.package.outputs.package_dir }}
        run: pnpm --dir "${PACKAGE_DIR}" run build

      - name: Check renderer workspace dependencies
        if: ${{ steps.meta.outputs.pkg != 'stream-markdown-parser' && steps.meta.outputs.pkg != 'markstream-core' }}
        env:
          PACKAGE_JSON: ${{ steps.package.outputs.package_json }}
        run: |
          node scripts/check-workspace-deps-published.mjs --package-json "${PACKAGE_JSON}"
          node scripts/check-packed-workspace-deps.mjs --package-json "${PACKAGE_JSON}"

      - name: Preserve legacy channel before new major
        env:
          PACKAGE_NAME: ${{ steps.meta.outputs.pkg }}
          PACKAGE_VERSION: ${{ steps.meta.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          # resolve-dist-tag refuses to publish a new major until the current
          # `latest` line is preserved on `legacy`; run that alias first so
          # the release queue never deadlocks on a first-time 2.x publish.
          node scripts/preserve-legacy-tag.mjs "${PACKAGE_NAME}" "${PACKAGE_VERSION}"

      - name: Publish package to npm
        env:
          PACKAGE_NAME: ${{ steps.meta.outputs.pkg }}
          PACKAGE_VERSION: ${{ steps.meta.outputs.version }}
          PACKAGE_DIR: ${{ steps.package.outputs.package_dir }}
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already published; skipping."
            exit 0
          fi

          DIST_TAG=""
          for attempt in 1 2 3 4 5; do
            if DIST_TAG="$(node scripts/resolve-dist-tag.mjs "${PACKAGE_NAME}" "${PACKAGE_VERSION}")"; then
              break
            fi
            echo "dist-tag resolution not yet consistent; retry ${attempt}/5"
            sleep 5
          done
          if [[ -z "${DIST_TAG}" ]]; then
            echo "Unable to resolve a stable dist-tag for ${PACKAGE_NAME}@${PACKAGE_VERSION}." >&2
            exit 1
          fi
          TARBALL="${RUNNER_TEMP}/${PACKAGE_NAME}-${PACKAGE_VERSION}.tgz"
          pnpm --dir "${PACKAGE_DIR}" pack --pack-destination "${RUNNER_TEMP}"
          npm publish "${TARBALL}" --access public --tag "${DIST_TAG}"

      - name: Build changelog body (best effort)
        id: changelog
        if: ${{ steps.meta.outputs.pkg == 'markstream-vue' }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          BODY_FILE="$(mktemp)"
          FOUND=0

          awk -v version="${VERSION}" '
            BEGIN { capture = 0; found = 0 }
            /^## \[/ {
              if (capture == 1)
                exit
              if ($0 ~ "^## \\[" version "\\]") {
                capture = 1
                found = 1
                next
              }
            }
            capture == 1 { print }
            END {
              if (found == 0)
                exit 2
            }
          ' CHANGELOG.md > "${BODY_FILE}" && FOUND=1 || true

          if [[ "${FOUND}" == "1" && -s "${BODY_FILE}" ]]; then
            echo "has_body=true" >> "${GITHUB_OUTPUT}"
            echo "body_path=${BODY_FILE}" >> "${GITHUB_OUTPUT}"
          else
            echo "has_body=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::Unable to find CHANGELOG.md section for version ${VERSION}; falling back to auto-generated release notes"
          fi

      - name: Create GitHub Release (markstream-vue with changelog)
        if: ${{ steps.meta.outputs.pkg == 'markstream-vue' && steps.changelog.outputs.has_body == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          body_path: ${{ steps.changelog.outputs.body_path }}
          append_body: true

      - name: Create GitHub Release (markstream-vue fallback)
        if: ${{ steps.meta.outputs.pkg == 'markstream-vue' && steps.changelog.outputs.has_body != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true

      - name: Create GitHub Release (0.1.0 renderer family)
        if: ${{ steps.meta.outputs.family_breaking == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          body: |
            ## Breaking changes in the Markstream 2.0 renderer family

            - Monaco and `stream-markdown` integrations, renderer selection, and their public configuration are removed.
            - `stream-diffs` is the only built-in enhanced code-block runtime; without it, code fences use the plain `<pre><code>` fallback.
            - These `0.1.0` adapter releases are not API-compatible with the prior `0.0.x` line.

            Migration guide: https://markstream.simonhe.me/guide/migration-2-0
          append_body: true

      - name: Create GitHub Release (other packages)
        if: ${{ steps.meta.outputs.pkg != 'markstream-vue' && steps.meta.outputs.family_breaking != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
