name: Release (Nightly)

# Nightlies only create tags. GitHub Releases are reserved for stable family
# releases (`.github/workflows/release-stable.yml`) so the repository's Releases
# page stays a readable per-version history instead of hundreds of prereleases.

on:
  schedule:
    # 02:15 UTC daily
    - cron: '15 2 * * *'
  workflow_dispatch:
    inputs:
      all:
        description: Tag all packages even if unchanged
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git identity (annotated tags)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create nightly tags (if needed)
        id: nightly
        shell: bash
        run: |
          set -euo pipefail

          ARGS=(--push --remote origin)
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.all }}" == "true" ]]; then
            ARGS+=(--all)
          fi

          node scripts/create-nightly-tags.mjs "${ARGS[@]}"
