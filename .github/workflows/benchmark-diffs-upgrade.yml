name: pierre-diffs upgrade benchmark

on:
  workflow_dispatch:
    inputs:
      versions:
        description: Comma-separated @pierre/diffs versions to compare
        required: false
        default: 1.2.12,1.6.4
      backends:
        description: Comma-separated highlighter backends to measure
        required: false
        default: shiki-js,highlights
  push:
    # `bench/**` allows an ad-hoc comparison from a scratch branch without
    # touching main; GitHub reads the workflow file from the pushed ref.
    branches: [main, 'bench/**']
    paths:
      - scripts/benchmark-diffs-versions.mjs
      - .github/workflows/benchmark-diffs-upgrade.yml

permissions:
  contents: read

jobs:
  benchmark:
    name: Version comparison
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The harness installs each @pierre/diffs version into its own temp
      # directory, so this job needs no workspace dependencies.
      - name: Run version benchmark
        env:
          # `github.event.inputs` is empty for `push`, so the script's own
          # defaults apply there; the bare `inputs` context is invalid on push.
          DIFFS_BENCH_VERSIONS: ${{ github.event.inputs.versions || '1.2.12,1.6.4' }}
          DIFFS_BENCH_BACKENDS: ${{ github.event.inputs.backends || 'shiki-js,highlights' }}
        run: node scripts/benchmark-diffs-versions.mjs

      - name: Append benchmark summary
        if: always()
        run: |
          if [ -f benchmark/diffs-upgrade/latest.md ]; then
            cat benchmark/diffs-upgrade/latest.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diffs-upgrade-benchmark
          path: benchmark/diffs-upgrade/
          if-no-files-found: warn
