name: Docs check

on:
  pull_request:
    branches: [main, 2.0.0]

jobs:
  build-docs:
    runs-on: ubuntu-latest
    env:
      # VitePress can exceed Node's 2 GB default heap while rendering the docs.
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check generated LLM docs
        run: pnpm docs:check-llms
      - name: Build docs
        run: pnpm docs:build:ci
